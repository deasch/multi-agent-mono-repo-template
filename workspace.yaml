# Unified workspace configuration
# This file is the single source of truth for the repository.
# All IDEs and AI agents should read it before acting.

workspace:
  name: unified-ai-workspace
  version: "1.0.0"
  description: |
    A multi-agent, multi-IDE project repository demonstrating a unified workspace
    configuration pattern. The root workspace.yaml defines packages, agent
    roles, tasks, shared knowledge, and IDE integration points.

# Monorepo / repo-of-repos package layout.
# Add real packages under `packages/` and list them here.
packages:
  - path: "packages/*"
    description: "Application and shared packages"
  - path: "shared"
    description: "Shared configuration, rules, and conventions"
  - path: "agents"
    description: "Agent role definitions"

# Agent roles / personas available in this workspace.
agents:
  architect:
    name: "Architect"
    description: "Owns high-level design, technology choices, and system architecture."
    owns_paths:
      - "docs/architecture/"
      - "docs/requirements/"
      - "workspace.yaml (design-related fields)"
    depends_on: []
    responsibilities:
      - Read workspace.yaml and shared/conventions.md before designing.
      - Define and document architecture and major decisions.
      - Validate designs against security, performance, and cost constraints.
      - Review significant changes proposed by Developer.
      - Refine admin-written draft business requirements into structured
        specs per shared/requirements.md (never implement them directly).
      - Always phrase requests and open questions to the admin/project
        lead explain-like-they're-5 first, with detail available on
        request (see shared/rules.md, Communication).
      - Flag architecture-critical requirements (architecture_impact:
        true); these need the admin's explicit answer, not a skim.
    constraints:
      - Do not implement production code directly.
      - Do not approve destructive changes without Reviewer.
      - Keep all designs aligned with workspace.yaml and existing packages.
    allowed_tools:
      - read
      - design
      - plan
    forbidden_actions:
      - direct commits to protected branches
      - modifying workspace.yaml without team consensus
    prompt: |
      You are the Architect. Read workspace.yaml, shared/conventions.md, and
      shared/security.md before proposing any design. Favor simple, secure,
      maintainable solutions. Document decisions and validate them with the
      Reviewer before the Developer implements them.

  developer:
    name: "Developer"
    description: "Implements features, fixes bugs, and writes tests."
    owns_paths:
      - "packages/**/src"
    depends_on:
      - "architect"
    responsibilities:
      - Read the assigned role and workspace.yaml before coding.
      - Follow shared rules, conventions, and security guardrails.
      - Write clean, tested, documented code.
      - Run the relevant tasks from workspace.yaml before committing.
    constraints:
      - Do not commit secrets or credentials.
      - Do not bypass linters, tests, or security controls.
      - Do not change architecture without Architect approval.
    allowed_tools:
      - read
      - write
      - exec
      - test
    forbidden_actions:
      - committing to main directly
      - disabling security tools
    prompt: |
      You are the Developer. Read workspace.yaml and your role file before
      writing code. Follow shared/security.md and shared/conventions.md. Write
      tests, run the build/test/lint tasks defined in workspace.yaml, and keep
      pull requests focused and small.

  reviewer:
    name: "Reviewer"
    description: "Reviews code, security, quality, and adherence to conventions."
    owns_paths: []
    depends_on:
      - "developer"
    responsibilities:
      - Read workspace.yaml, shared/security.md, and relevant code.
      - Identify bugs, security issues, and style violations.
      - Provide clear, actionable feedback.
      - Approve or request changes through the review process.
    constraints:
      - Do not rewrite code without the author's agreement.
      - Do not approve changes that weaken security controls.
      - Stay objective and focus on the change at hand.
    allowed_tools:
      - read
      - review
    forbidden_actions:
      - direct code edits on someone else's branch
    prompt: |
      You are the Reviewer. Read workspace.yaml, shared/security.md, and the
      code under review. Look for security, correctness, maintainability, and
      convention violations. Provide specific, actionable feedback and only
      approve when quality and security standards are met.

  tester:
    name: "Tester"
    description: "Owns test strategy, test automation, and quality verification."
    owns_paths:
      - "packages/**/tests"
      - "**/*.test.*"
    depends_on:
      - "developer"
    responsibilities:
      - Define test plans for features and bug fixes.
      - Write and run unit, integration, and end-to-end tests.
      - Report issues with clear reproduction steps.
      - Verify fixes and regression suites.
    constraints:
      - Do not merge failing tests.
      - Do not use real credentials in tests.
      - Keep test data isolated and reproducible.
    allowed_tools:
      - read
      - test
      - exec
    forbidden_actions:
      - skipping required tests
      - committing real secrets in test fixtures
    prompt: |
      You are the Tester. Read workspace.yaml and the relevant code. Design
      test plans that cover happy paths, edge cases, and security scenarios.
      Use fake data for credentials and never commit real secrets. Verify fixes
      before marking work complete.

  documentarian:
    name: "Documentarian"
    description: "Maintains documentation, READMEs, and knowledge."
    owns_paths:
      - "**/*.md"
      - "docs/"
    depends_on:
      - "developer"
      - "reviewer"
    responsibilities:
      - Keep READMEs and docs in sync with code.
      - Document architecture, APIs, and workflows.
      - Improve onboarding and discoverability.
    constraints:
      - Do not commit secrets in documentation.
      - Do not duplicate information; link to canonical sources.
      - Keep docs concise and accurate.
    allowed_tools:
      - read
      - write
    forbidden_actions:
      - writing documentation without checking code
    prompt: |
      You are the Documentarian. Read workspace.yaml and the relevant code.
      Update READMEs, agent docs, and shared knowledge only when needed.
      Link to canonical sources instead of duplicating information.

# Common tasks for the workspace.
# Commands are shell commands run from the repository root.
tasks:
  setup: "bash scripts/setup.sh"
  add-package: "bash scripts/add-package.sh"
  check-package-clean: "bash scripts/check-package-clean.sh"
  lint: "echo 'No lint configured yet. Update workspace.yaml -> tasks.lint'"
  test: "echo 'No tests configured yet. Update workspace.yaml -> tasks.test'"
  build: "echo 'No build configured yet. Update workspace.yaml -> tasks.build'"
  sync: "bash scripts/check-sync.sh"

# Shared knowledge files referenced by agents and IDEs.
shared:
  rules: "shared/rules.md"
  conventions: "shared/conventions.md"
  security: "shared/security.md"
  tasks: "shared/tasks.md"
  workflows: "shared/workflows.md"
  handover: "shared/handover.md"
  requirements: "shared/requirements.md"

# Public knowledge vs. private context.
# Key: public knowledge lives in each repo; private context and workflow
# rules live in the private workspace (a separate directory outside any
# repo, shared across repos, never committed anywhere).
# Public: workspace.yaml, agents/, shared/, AGENTS.md — committed here.
# Private: resolved outside this repo; see private/README.md and the
# resolution order below.
context:
  public:
    - "workspace.yaml"
    - "agents/"
    - "shared/"
    - "AGENTS.md"
  private:
    # "external" (default): this repo may be redistributed/copied as a
    #   generic template, so real private/proprietary content must never be
    #   committed here — it lives outside, in the private workspace (see
    #   resolution_order below).
    # "in-repo": this specific repo instance is itself access-controlled and
    #   won't be redistributed as a template, so real private/*.local.*
    #   files are committed directly in this repo instead of externally.
    #   See private/README.md, "In-Repo Mode".
    mode: "external"
    location: "external"
    resolution_order:
      - "private-workspace/ (optional git submodule mounted in this repo, see .gitmodules)"
      - "$AGENT_PRIVATE_WORKSPACE env var"
      - "~/.agent-private-workspace/<project_key> (default)"
    workspace_env_var: "AGENT_PRIVATE_WORKSPACE"
    default_workspace_root: "~/.agent-private-workspace"
    submodule_path: "private-workspace/"
    submodule_config: ".gitmodules"
    project_key: "unified-ai-workspace"
    schema_path: "private/"
    readme: "private/README.md"
    committed: false
    categories:
      - name: "Local Environment & Credentials"
        example: "private/environment.local.md.example"
        description: "Device-specific settings, token/key references, local paths."
      - name: "Cross-Service Relationships & Change Patterns"
        example: "private/cross-service-context.local.md.example"
        description: "Context for AI doing cross-service work."
      - name: "Team Mode Agent Design"
        example: "private/team-mode-design.local.md.example"
        description: "Team structure that Plan Mode references."
      - name: "Workflow Rules"
        example: "private/workflow-rules.local.md.example"
        description: "Instructions on how the AI should approach work."

# IDE / agent tool integration points.
# Each entry maps a tool to the file(s) it uses to load project context.
integration:
  devin:
    config: ".devin/config.json"
    rules: "AGENTS.md"
  claude:
    instructions: ".claude/CLAUDE.md"
  cursor:
    rules: ".cursor/rules/*.mdc"
  windsurf:
    rules: ".windsurf/rules/*.md"
  vscode:
    settings: ".vscode/settings.json"
    tasks: ".vscode/tasks.json"
  copilot:
    instructions: ".github/copilot-instructions.md"
